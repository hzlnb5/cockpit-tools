name: Build Codex WebGPT Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/codex-webgpt-guard/**"
      - ".github/workflows/build-codex-webgpt-guard.yml"
  push:
    branches: [main]
    paths:
      - "tools/codex-webgpt-guard/**"
      - ".github/workflows/build-codex-webgpt-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go setup
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Reconstruct and verify exact Guard source
        shell: pwsh
        run: |
          $root = "tools/codex-webgpt-guard"
          $build = "$root/build"
          Remove-Item -Recurse -Force $build -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $build | Out-Null

          $manifest = @(
            "source.b64.00.0",
            "source.b64.00.1",
            "source.b64.00.2.0",
            "source.b64.00.2.1.0",
            "source.b64.00.2.1.1",
            "source.b64.00.2.1.2",
            "source.b64.00.2.1.3",
            "source.b64.00.2.1.4",
            "source.b64.00.2.2",
            "source.b64.00.2.3",
            "source.b64.01",
            "source.b64.02",
            "source.b64.03",
            "source.b64.04.0.0",
            "source.b64.04.0.1",
            "source.b64.04.0.2",
            "source.b64.04.0.3",
            "source.b64.04.1",
            "source.b64.04.2",
            "source.b64.05",
            "source.b64.06",
            "source.b64.07",
            "source.b64.08",
            "source.b64.09.0",
            "source.b64.09.1",
            "source.b64.09.2.0.0",
            "source.b64.09.2.0.1",
            "source.b64.09.2.0.2",
            "source.b64.09.2.0.3",
            "source.b64.09.2.0.4",
            "source.b64.09.2.1",
            "source.b64.09.2.2",
            "source.b64.09.2.3",
            "source.b64.10"
          )
          $b64 = ($manifest | ForEach-Object {
            $p = Join-Path $root $_
            if (-not (Test-Path -LiteralPath $p)) { throw "Missing Guard source chunk: $p" }
            (Get-Content -Raw -LiteralPath $p).Trim()
          }) -join ""

          $zip = [Convert]::FromBase64String($b64)
          $archive = "$root/source-ci.zip"
          [IO.File]::WriteAllBytes($archive, $zip)
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "b91fdbd136ee7644d6afb6c703b4f48558cc0048ca59c28a6ae9791cbc05a150"
          if ($hash -ne $expected) { throw "Guard source archive hash mismatch: $hash" }

          Expand-Archive -LiteralPath $archive -DestinationPath $build -Force

      - name: Test
        working-directory: tools/codex-webgpt-guard/build
        run: go test ./...

      - name: Vet
        working-directory: tools/codex-webgpt-guard/build
        run: go vet ./...

      - name: Build
        working-directory: tools/codex-webgpt-guard/build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/codex-webgpt-guard.exe .
          Copy-Item README.md dist/README.md
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe install
          echo.
          echo Installation finished. You can keep using Cockpit normally.
          pause
          "@ | Set-Content -Encoding ascii dist/INSTALL.cmd
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe status
          pause
          "@ | Set-Content -Encoding ascii dist/STATUS.cmd
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe uninstall
          pause
          "@ | Set-Content -Encoding ascii dist/UNINSTALL.cmd
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-webgpt-guard.exe).Hash.ToLowerInvariant()
          "$hash  codex-webgpt-guard.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Smoke test binary
        working-directory: tools/codex-webgpt-guard/build
        shell: pwsh
        run: |
          .\dist\codex-webgpt-guard.exe help
          .\dist\codex-webgpt-guard.exe status

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codex-webgpt-guard-windows-x64
          retention-days: 30
          if-no-files-found: error
          path: tools/codex-webgpt-guard/build/dist/**
