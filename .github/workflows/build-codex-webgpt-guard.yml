name: Build Codex WebGPT Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/codex-webgpt-guard/**"
      - ".github/workflows/build-codex-webgpt-guard.yml"
  push:
    branches: [main]
    paths:
      - "tools/codex-webgpt-guard/**"
      - ".github/workflows/build-codex-webgpt-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go setup
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Extract source
        shell: pwsh
        run: |
          $build = "tools/codex-webgpt-guard/build"
          Remove-Item -Recurse -Force $build -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          Expand-Archive -Path "tools/codex-webgpt-guard/source.zip" -DestinationPath $build -Force

      - name: Verify canonical hardened source
        shell: pwsh
        run: |
          $win = Get-Content -Raw "tools/codex-webgpt-guard/build/platform_windows.go"
          $main = Get-Content -Raw "tools/codex-webgpt-guard/build/main.go"
          if (-not $win.Contains("freshCodexRecoveryScript")) { throw "fresh launch recovery guard is missing" }
          if ($win.Contains("Get-Process ChatGPT,Codex -ErrorAction SilentlyContinue | Stop-Process -Force")) {
            throw "unsafe broad process termination is present"
          }
          if ($win.Contains('if($p.ProcessName -eq ''Codex'')')) { throw "process-name fallback must fail closed" }
          if ($win.Contains('Name -like ''Codex*''') -or $win.Contains('Name -like ''ChatGPT*''')) {
            throw "StartApps display-name fallback must fail closed"
          }
          if (-not $win.Contains('$families.Count -ne 1')) { throw "ambiguous launch-family fail-closed guard is missing" }
          if (-not $main.Contains('d.Kind != "codex-web-gpt-launcher"')) { throw "exact launcher descriptor kind check is missing" }
          if (-not $main.Contains('strings.TrimSpace(d.Endpoint) == ""')) { throw "empty launcher endpoint fail-closed guard is missing" }
          if (-not $main.Contains('context.WithTimeout(context.Background(), 20*time.Second)')) { throw "route lifecycle timeout is missing" }
          if (-not $main.Contains('CheckRedirect')) { throw "health probe redirect guard is missing" }

      - name: Test
        working-directory: tools/codex-webgpt-guard/build
        run: go test ./... -count=1

      - name: Vet
        working-directory: tools/codex-webgpt-guard/build
        run: go vet ./...

      - name: Build
        working-directory: tools/codex-webgpt-guard/build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/codex-webgpt-guard.exe .
          Copy-Item README.md dist/README.md
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe install
          if errorlevel 1 (
            echo.
            echo Installation failed. See the error above.
            pause
            exit /b 1
          )
          echo.
          echo Installation finished. You can keep using Cockpit normally.
          pause
          "@ | Set-Content -Encoding ascii dist/INSTALL.cmd
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe status
          pause
          "@ | Set-Content -Encoding ascii dist/STATUS.cmd
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe uninstall
          if errorlevel 1 (
            echo.
            echo Uninstall failed. See the error above.
            pause
            exit /b 1
          )
          pause
          "@ | Set-Content -Encoding ascii dist/UNINSTALL.cmd
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-webgpt-guard.exe).Hash.ToLowerInvariant()
          "$hash  codex-webgpt-guard.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Smoke test binary
        working-directory: tools/codex-webgpt-guard/build
        shell: pwsh
        run: |
          .\dist\codex-webgpt-guard.exe help
          .\dist\codex-webgpt-guard.exe status

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codex-webgpt-guard-windows-x64
          retention-days: 30
          if-no-files-found: error
          path: tools/codex-webgpt-guard/build/dist/**
