name: Build Codex WebGPT Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/codex-webgpt-guard/**"
      - ".github/workflows/build-codex-webgpt-guard.yml"
  push:
    branches: [main]
    paths:
      - "tools/codex-webgpt-guard/**"
      - ".github/workflows/build-codex-webgpt-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go setup
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Extract source
        shell: pwsh
        run: |
          $build = "tools/codex-webgpt-guard/build"
          Remove-Item -Recurse -Force $build -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          Expand-Archive -Path "tools/codex-webgpt-guard/source.zip" -DestinationPath $build -Force

      - name: Apply audited hardening
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r' < tools/codex-webgpt-guard/hardening-v2.patch > "$RUNNER_TEMP/hardening-v2.patch"
          git apply --whitespace=nowarn --directory=tools/codex-webgpt-guard/build -p2 "$RUNNER_TEMP/hardening-v2.patch"
          tr -d '\r' < tools/codex-webgpt-guard/hardening-v4.patch > "$RUNNER_TEMP/hardening-v4.patch"
          git apply --whitespace=nowarn --directory=tools/codex-webgpt-guard/build -p2 "$RUNNER_TEMP/hardening-v4.patch"

      - name: Verify final safety invariants
        shell: pwsh
        run: |
          $win = Get-Content -Raw "tools/codex-webgpt-guard/build/platform_windows.go"
          $main = Get-Content -Raw "tools/codex-webgpt-guard/build/main.go"
          if (-not $win.Contains("freshCodexRecoveryScript")) { throw "launch-race recovery guard is missing" }
          if ($win.Contains("Get-Process ChatGPT,Codex -ErrorAction SilentlyContinue | Stop-Process")) { throw "unsafe broad process termination is present" }
          if ($win.Contains("ProcessName -eq 'Codex'")) { throw "process-name fallback must fail closed" }
          if ($win.Contains("Name -like 'Codex*'") -or $win.Contains("Name -like 'ChatGPT*'")) { throw "StartApps display-name fallback must fail closed" }
          if (-not $win.Contains("families.Count -ne 1")) { throw "ambiguous launch-family fail-closed guard is missing" }
          $entryCheck = $win.IndexOf("matches.Count -ne 1")
          $stop = $win.IndexOf("Stop-Process -Id")
          if ($entryCheck -lt 0 -or $stop -lt 0 -or $entryCheck -gt $stop) { throw "restart target is not proven before process termination" }
          if (-not $main.Contains('d.Kind != "codex-web-gpt-launcher"')) { throw "exact launcher kind validation is missing" }
          if (-not $main.Contains('strings.TrimSpace(d.Endpoint) == ""')) { throw "empty endpoint fail-closed check is missing" }
          if (-not $main.Contains('context.WithTimeout(context.Background(), 20*time.Second)')) { throw "route lifecycle timeout is missing" }
          if (-not $main.Contains("CheckRedirect")) { throw "health redirect guard is missing" }
          if (-not $main.Contains("guard startup cancelled by stop request")) { throw "self-update stop-marker race guard is missing" }

      - name: Format check
        shell: pwsh
        working-directory: tools/codex-webgpt-guard/build
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            $unformatted
            throw "Guard source is not gofmt-clean"
          }

      - name: Test
        working-directory: tools/codex-webgpt-guard/build
        run: go test ./... -count=1

      - name: Vet
        working-directory: tools/codex-webgpt-guard/build
        run: go vet ./...

      - name: Build
        working-directory: tools/codex-webgpt-guard/build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/codex-webgpt-guard.exe .
          Copy-Item README.md dist/README.md
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe install
          if errorlevel 1 (
            echo.
            echo Installation failed. See the error above.
            pause
            exit /b 1
          )
          echo.
          echo Installation finished. You can keep using Cockpit normally.
          pause
          "@ | Set-Content -Encoding ascii dist/INSTALL.cmd
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe status
          if errorlevel 1 (
            echo.
            echo Status check failed. See the error above.
            pause
            exit /b 1
          )
          pause
          "@ | Set-Content -Encoding ascii dist/STATUS.cmd
          @"
          @echo off
          cd /d "%~dp0"
          codex-webgpt-guard.exe uninstall
          if errorlevel 1 (
            echo.
            echo Uninstall failed. See the error above.
            pause
            exit /b 1
          )
          pause
          "@ | Set-Content -Encoding ascii dist/UNINSTALL.cmd
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-webgpt-guard.exe).Hash.ToLowerInvariant()
          "$hash  codex-webgpt-guard.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Binary smoke test
        working-directory: tools/codex-webgpt-guard/build
        shell: pwsh
        run: |
          .\dist\codex-webgpt-guard.exe help
          if ($LASTEXITCODE -ne 0) { throw "help smoke test failed" }
          .\dist\codex-webgpt-guard.exe status
          if ($LASTEXITCODE -ne 0) { throw "status smoke test failed" }

      - name: Install, self-update, and uninstall smoke test
        working-directory: tools/codex-webgpt-guard/build
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "GuardLocal"
          $env:CODEX_CHATGPT_WEB_HOME = Join-Path $env:RUNNER_TEMP "GuardWebHome"
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "GuardCodexHome"
          Remove-Item -Recurse -Force $env:LOCALAPPDATA,$env:CODEX_CHATGPT_WEB_HOME,$env:CODEX_HOME -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA,$env:CODEX_CHATGPT_WEB_HOME,$env:CODEX_HOME | Out-Null

          $exe = (Resolve-Path ".\dist\codex-webgpt-guard.exe").Path
          & $exe install
          if ($LASTEXITCODE -ne 0) { throw "first install failed" }

          $installed = Join-Path $env:LOCALAPPDATA "CodexWebGPTGuard\codex-webgpt-guard.exe"
          if (-not (Test-Path $installed)) { throw "installed executable is missing" }

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $runValue = (Get-ItemProperty -Path $runKey -Name CodexWebGPTGuard -ErrorAction Stop).CodexWebGPTGuard
          if (-not $runValue -or -not $runValue.Contains("codex-webgpt-guard.exe")) { throw "HKCU startup registration is missing" }

          Start-Sleep -Milliseconds 600
          & $exe install
          if ($LASTEXITCODE -ne 0) { throw "second install/self-update path failed" }

          & $exe status
          if ($LASTEXITCODE -ne 0) { throw "status failed after self-update" }

          & $exe uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }

          $runValueAfter = (Get-ItemProperty -Path $runKey -Name CodexWebGPTGuard -ErrorAction SilentlyContinue).CodexWebGPTGuard
          if ($runValueAfter) { throw "HKCU startup registration remained after uninstall" }

          $deadline = (Get-Date).AddSeconds(6)
          do {
            $alive = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.Equals($installed, [System.StringComparison]::OrdinalIgnoreCase)
            })
            if ($alive.Count -eq 0) { break }
            Start-Sleep -Milliseconds 200
          } while ((Get-Date) -lt $deadline)
          if ($alive.Count -ne 0) { throw "background Guard process did not exit after uninstall" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codex-webgpt-guard-windows-x64
          retention-days: 30
          if-no-files-found: error
          path: tools/codex-webgpt-guard/build/dist/**
