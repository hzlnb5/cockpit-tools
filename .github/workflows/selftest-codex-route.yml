name: Self-test Codex external route compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codex-route-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-route-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Core Rust tests
        run: cargo test --package cockpit-core -- --test-threads=1

      - name: Check Windows Tauri library
        run: cargo check --package cockpit-tools --lib
