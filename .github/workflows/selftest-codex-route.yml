name: Self-test Codex external route compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codex-route-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-route-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: route-core

      - name: Preserve external route
        run: cargo test --package cockpit-core oauth_account_switch_preserves_external_openai_base_url -- --test-threads=1

      - name: Clean Cockpit-owned route
        run: cargo test --package cockpit-core switching_from_cockpit_api_route_to_oauth_cleans_cockpit_route -- --test-threads=1

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: route-windows

      - name: Check Windows Tauri library
        run: cargo check --package cockpit-tools --lib
